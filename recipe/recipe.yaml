context:
  version: "1.35.0"

package:
  name: cloudvision
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/cloudvision/cloudvision-${{ version }}.tar.gz
  sha256: ebc5b885956cdbcd90e8462b70a180ebdde60340e26ebb80151d7420c50d175c

build:
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=62.1.0
  run:
    - python >=${{ python_min }}
    - aristaproto ==0.1.5
    - cryptography ==50.0.0
    - grpcio >=1.81.1
    - msgpack-python >=1.0.3
    - protobuf >=6.33.6,<8.0dev
    - pyavd-utils ==0.0.7
    - requests >=2.20.1
    - typing-extensions >=4.2.0
    - anytree ==2.13.0

tests:
  - python:
      imports:
        - cloudvision
        - arista
        - fmp
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/aristanetworks/cloudvision-python
  summary: A Python library for Arista's CloudVision APIs and Provisioning Action integrations
  license: Apache-2.0
  license_file: COPYING
  documentation: https://aristanetworks.github.io/cloudvision-python/
  repository: https://github.com/aristanetworks/cloudvision-python

extra:
  recipe-maintainers:
    - pb01ka
